syntax = "proto3";

package dual_engine.shell.v1;

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_CHROMIUM = 1;
  ENGINE_GECKO = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_BROWSER_LIFECYCLE = 1;
  CAPABILITY_NAVIGATION = 2;
  CAPABILITY_RESIZE = 3;
  CAPABILITY_FOCUS = 4;
  CAPABILITY_LOADING_EVENTS = 5;
  CAPABILITY_NATIVE_X11_SURFACE = 6;
  CAPABILITY_FILE_DESCRIPTOR_PASSING = 7;
}

message Packet {
  uint64 request_id = 1;
  repeated AttachedFile attached_files = 2;

  oneof body {
    Hello hello = 10;
    HelloReply hello_reply = 11;
    Request request = 12;
    Response response = 13;
    Event event = 14;
  }
}

message AttachedFile {
  uint32 index = 1;
  uint64 size = 2;
  string purpose = 3;
}

message Hello {
  uint32 minimum_major = 1;
  uint32 maximum_major = 2;
  uint32 maximum_packet_bytes = 3;
  repeated Capability requested_capabilities = 4;
}

message HelloReply {
  uint32 major = 1;
  uint32 minor = 2;
  Engine engine = 3;
  string engine_version = 4;
  uint32 cef_api_version = 5;
  uint32 maximum_packet_bytes = 6;
  repeated Capability capabilities = 7;
}

message Request {
  uint64 browser_id = 1;

  oneof operation {
    CreateBrowser create_browser = 10;
    Navigate navigate = 11;
    Resize resize = 12;
    SetFocus set_focus = 13;
    Reload reload = 14;
    Close close = 15;
  }
}

message CreateBrowser {
  string initial_url = 1;
  SurfaceTarget surface = 2;
}

message SurfaceTarget {
  oneof target {
    X11Target x11 = 1;
    WaylandTarget wayland = 2;
    OffscreenTarget offscreen = 3;
  }
}

message Viewport {
  int32 x = 1;
  int32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  double scale_factor = 5;
}

message X11Target {
  uint64 parent_window = 1;
  Viewport viewport = 2;
}

message WaylandTarget {
  string presentation_token = 1;
  Viewport viewport = 2;
}

message OffscreenTarget {
  Viewport viewport = 1;
}

message Navigate {
  string url = 1;
}

message Resize {
  Viewport viewport = 1;
}

message SetFocus {
  bool focused = 1;
}

message Reload {}

message Close {
  bool force = 1;
}

message Response {
  oneof result {
    Success success = 1;
    Error error = 2;
  }
}

message Success {}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string backend_code = 4;
}

message Event {
  uint64 sequence = 1;
  uint64 browser_id = 2;

  oneof value {
    SurfaceReady surface_ready = 10;
    LoadingChanged loading_changed = 11;
    NavigationCommitted navigation_committed = 12;
    TitleChanged title_changed = 13;
    LoadFailed load_failed = 14;
    BrowserClosed browser_closed = 15;
    BrowserCrashed browser_crashed = 16;
  }
}

message SurfaceReady {
  oneof presentation {
    X11Surface x11 = 1;
    WaylandSurface wayland = 2;
    DmabufStream dmabuf = 3;
    OffscreenSurface offscreen = 4;
  }
}

message X11Surface {
  uint64 window = 1;
}

message WaylandSurface {
  string presentation_token = 1;
}

message DmabufStream {
  uint32 format = 1;
  repeated uint64 modifiers = 2;
}

message OffscreenSurface {
  uint32 format = 1;
}

message LoadingChanged {
  bool loading = 1;
}

message NavigationCommitted {
  string url = 1;
}

message TitleChanged {
  string title = 1;
}

message LoadFailed {
  int32 error_code = 1;
  string error_text = 2;
  string failed_url = 3;
}

message BrowserClosed {}

message BrowserCrashed {
  string reason = 1;
}
