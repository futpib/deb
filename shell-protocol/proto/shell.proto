syntax = "proto3";

package deb.shell;

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_CHROMIUM = 1;
  ENGINE_GECKO = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_BROWSER_LIFECYCLE = 1;
  CAPABILITY_NAVIGATION = 2;
  CAPABILITY_RESIZE = 3;
  CAPABILITY_FOCUS = 4;
  CAPABILITY_LOADING_EVENTS = 5;
  CAPABILITY_ACCELERATED_DMABUF_SURFACE = 6;
  CAPABILITY_COOKIE_SYNC = 7;
  CAPABILITY_MULTIPLE_BROWSERS = 8;
  CAPABILITY_VISIBILITY = 9;
  CAPABILITY_RENDERER_CRASH_EVENTS = 10;
  CAPABILITY_POINTER_INPUT = 11;
  CAPABILITY_KEYBOARD_INPUT = 12;
  CAPABILITY_CURSOR_EVENTS = 13;
  CAPABILITY_TOUCH_INPUT = 14;
  CAPABILITY_FULLSCREEN = 15;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_MIDDLE = 2;
  MOUSE_BUTTON_RIGHT = 3;
}

enum KeyEventType {
  KEY_EVENT_TYPE_UNSPECIFIED = 0;
  KEY_EVENT_TYPE_RAW_KEY_DOWN = 1;
  KEY_EVENT_TYPE_CHARACTER = 2;
  KEY_EVENT_TYPE_KEY_UP = 3;
}

enum TouchEventType {
  TOUCH_EVENT_TYPE_UNSPECIFIED = 0;
  TOUCH_EVENT_TYPE_RELEASED = 1;
  TOUCH_EVENT_TYPE_PRESSED = 2;
  TOUCH_EVENT_TYPE_MOVED = 3;
  TOUCH_EVENT_TYPE_CANCELLED = 4;
}

enum PointerDeviceType {
  POINTER_DEVICE_TYPE_UNSPECIFIED = 0;
  POINTER_DEVICE_TYPE_TOUCH = 1;
  POINTER_DEVICE_TYPE_PEN = 2;
  POINTER_DEVICE_TYPE_ERASER = 3;
}

message Packet {
  uint64 request_id = 1;

  oneof body {
    Hello hello = 10;
    HelloReply hello_reply = 11;
    Request request = 12;
    Response response = 13;
    Event event = 14;
    FrameRelease frame_release = 15;
  }
}

message Hello {
  uint32 maximum_packet_bytes = 1;
  repeated Capability requested_capabilities = 2;
}

message HelloReply {
  Engine engine = 1;
  string engine_version = 2;
  uint32 cef_api_version = 3;
  uint32 maximum_packet_bytes = 4;
  repeated Capability capabilities = 5;
}

message Request {
  uint64 browser_id = 1;

  oneof operation {
    CreateBrowser create_browser = 10;
    Navigate navigate = 11;
    Resize resize = 12;
    SetFocus set_focus = 13;
    Reload reload = 14;
    Close close = 15;
    ReadCookies read_cookies = 16;
    SetCookie set_cookie = 17;
    DeleteCookie delete_cookie = 18;
    SetVisibility set_visibility = 19;
    Shutdown shutdown = 20;
    MouseMove mouse_move = 21;
    MouseClick mouse_click = 22;
    MouseWheel mouse_wheel = 23;
    KeyEvent key_event = 24;
    TouchEvent touch_event = 25;
  }
}

message CreateBrowser {
  string initial_url = 1;
  SurfaceTarget surface = 2;
  string profile_id = 3;
  string profile_data_path = 4;
  string profile_cache_path = 5;
}

message Viewport {
  int32 x = 1;
  int32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
  double scale_factor = 5;
}

message SurfaceTarget {
  uint64 parent_window = 1;
  Viewport viewport = 2;
}

message FrameRelease {
  uint64 browser_id = 1;
  uint64 frame_id = 2;
}

message Navigate {
  string url = 1;
}

message Resize {
  Viewport viewport = 1;
}

message SetFocus {
  bool focused = 1;
}

message Reload {}

message Close {
  bool force = 1;
}

message ReadCookies {}

message SetCookie {
  Cookie cookie = 1;
}

message DeleteCookie {
  Cookie cookie = 1;
}

message SetVisibility {
  bool visible = 1;
}

message Shutdown {}

message MouseMove {
  int32 x = 1;
  int32 y = 2;
  uint32 modifiers = 3;
  bool leaving = 4;
}

message MouseClick {
  int32 x = 1;
  int32 y = 2;
  uint32 modifiers = 3;
  MouseButton button = 4;
  bool mouse_up = 5;
  uint32 click_count = 6;
}

message MouseWheel {
  int32 x = 1;
  int32 y = 2;
  uint32 modifiers = 3;
  int32 delta_x = 4;
  int32 delta_y = 5;
}

message TouchEvent {
  int32 id = 1;
  float x = 2;
  float y = 3;
  float radius_x = 4;
  float radius_y = 5;
  float rotation_angle = 6;
  float pressure = 7;
  TouchEventType event_type = 8;
  uint32 modifiers = 9;
  PointerDeviceType pointer_type = 10;
}

message KeyEvent {
  KeyEventType event_type = 1;
  uint32 modifiers = 2;
  int32 windows_key_code = 3;
  int32 native_key_code = 4;
  bool is_system_key = 5;
  uint32 character = 6;
  uint32 unmodified_character = 7;
}

message Response {
  oneof result {
    Success success = 1;
    Error error = 2;
  }
}

message Success {}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string backend_code = 4;
}

message Event {
  uint64 sequence = 1;
  uint64 browser_id = 2;

  oneof value {
    SurfaceReady surface_ready = 10;
    LoadingChanged loading_changed = 11;
    NavigationCommitted navigation_committed = 12;
    TitleChanged title_changed = 13;
    LoadFailed load_failed = 14;
    BrowserClosed browser_closed = 15;
    BrowserCrashed browser_crashed = 16;
    CookieSnapshotEntry cookie_snapshot_entry = 17;
    CookieSnapshotComplete cookie_snapshot_complete = 18;
    CookieChanged cookie_changed = 19;
    AcceleratedFrame accelerated_frame = 20;
    SurfaceCleared surface_cleared = 21;
    CursorChanged cursor_changed = 22;
    FullscreenChanged fullscreen_changed = 23;
  }
}

message SurfaceReady {}

message CursorChanged {
  uint32 cef_type = 1;
  bytes custom_bgra = 2;
  uint32 width = 3;
  uint32 height = 4;
  int32 hotspot_x = 5;
  int32 hotspot_y = 6;
  float image_scale_factor = 7;
}

message FullscreenChanged {
  bool fullscreen = 1;
}

enum SurfaceLayer {
  SURFACE_LAYER_UNSPECIFIED = 0;
  SURFACE_LAYER_VIEW = 1;
  SURFACE_LAYER_POPUP = 2;
}

message DmabufPlane {
  uint32 fd_index = 1;
  uint32 stride = 2;
  uint64 offset = 3;
}

message AcceleratedFrame {
  uint64 frame_id = 1;
  SurfaceLayer layer = 2;
  int32 x = 3;
  int32 y = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 drm_format = 7;
  uint64 modifier = 8;
  repeated DmabufPlane planes = 9;
  bool has_acquire_fence = 10;
  uint32 acquire_fence_fd_index = 11;
  bool flip_y = 12;
}

message SurfaceCleared {
  SurfaceLayer layer = 1;
}

message LoadingChanged {
  bool loading = 1;
}

message NavigationCommitted {
  string url = 1;
}

message TitleChanged {
  string title = 1;
}

message LoadFailed {
  int32 error_code = 1;
  string error_text = 2;
  string failed_url = 3;
}

message BrowserClosed {}

message BrowserCrashed {
  string reason = 1;
}

enum CookieSameSite {
  COOKIE_SAME_SITE_UNSPECIFIED = 0;
  COOKIE_SAME_SITE_NONE = 1;
  COOKIE_SAME_SITE_LAX = 2;
  COOKIE_SAME_SITE_STRICT = 3;
}

enum CookiePriority {
  COOKIE_PRIORITY_LOW = 0;
  COOKIE_PRIORITY_MEDIUM = 1;
  COOKIE_PRIORITY_HIGH = 2;
}

enum CookieChangeCause {
  COOKIE_CHANGE_CAUSE_INSERTED = 0;
  COOKIE_CHANGE_CAUSE_EXPLICIT = 1;
  COOKIE_CHANGE_CAUSE_UNKNOWN_DELETION = 2;
  COOKIE_CHANGE_CAUSE_OVERWRITE = 3;
  COOKIE_CHANGE_CAUSE_EXPIRED = 4;
  COOKIE_CHANGE_CAUSE_EVICTED = 5;
  COOKIE_CHANGE_CAUSE_EXPIRED_OVERWRITE = 6;
  COOKIE_CHANGE_CAUSE_INSERTED_NO_CHANGE_OVERWRITE = 7;
  COOKIE_CHANGE_CAUSE_INSERTED_NO_VALUE_CHANGE_OVERWRITE = 8;
}

message CookiePartitionKey {
  string top_level_site = 1;
  bool has_cross_site_ancestor = 2;
  bool opaque = 3;
}

message CookieKey {
  string name = 1;
  string domain = 2;
  string path = 3;
  CookiePartitionKey partition_key = 4;
}

message Cookie {
  CookieKey key = 1;
  string value = 2;
  bool secure = 3;
  bool http_only = 4;
  int64 creation = 5;
  int64 last_access = 6;
  optional int64 expires = 7;
  CookieSameSite same_site = 8;
  CookiePriority priority = 9;
  int64 last_update = 10;
}

message CookieSnapshotEntry {
  Cookie cookie = 1;
}

message CookieSnapshotComplete {}

message CookieChanged {
  Cookie cookie = 1;
  CookieChangeCause cause = 2;
}
