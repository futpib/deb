[package]
name = "deb"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["cef-renderer", "firefox-cef", "shell-protocol"]
resolver = "3"

[dependencies]
qtbridge = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-protocol = { version = "0.1.0", path = "shell-protocol" }
x11rb = "0.14.0"
xdg = "3.0.0"

[build-dependencies]
cc = "1.4.0"
pkg-config = "0.3.33"
